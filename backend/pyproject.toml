[tool.poetry]
name = "deporte-backend"
version = "0.1.0"
description = "FastAPI backend для интернет-магазина DEPORTE"
authors = ["Nika <nika@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.1"
uvicorn = "^0.30.1"
sqlalchemy = "^2.0.31"
psycopg2-binary = "^2.9.9"
pydantic = "^2.7.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"