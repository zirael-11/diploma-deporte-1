[tool.poetry]
name = "deporte-backend"
version = "0.1.0"
description = "FastAPI backend для интернет-магазина DEPORTE"
authors = ["Nika <nika@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.1"
uvicorn = "^0.30.1"
sqlalchemy = "^2.0.31"
asyncpg = "^0.29.0"  # Добавили асинхронный драйвер СУБД вместо старого psycopg2
pydantic = "^2.7.4"
pydantic-settings = "^2.3.4"  # Добавили для продвинутых настроек BaseSettings

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"