[tool.poetry]
name = "deporte-backend"
version = "0.1.0"
description = "FastAPI backend для интернет-магазина DEPORTE"
authors = ["Nika <nika@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.1"
uvicorn = "^0.30.1"
sqlalchemy = "^2.0.31"
asyncpg = "^0.29.0" 
pydantic = "^2.7.4"
pydantic-settings = "^2.3.4" 
alembic = "^1.19.1"
python-dotenv = "^1.2.3"
psycopg2-binary = "^2.9.12"
pwdlib = { version = "^0.3.1", extras = ["argon2"] }
redis = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"