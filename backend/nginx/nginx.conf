events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # # ИСПРАВЛЕНО: Профессиональная раздача медиа-контента DEPORTE напрямую через Nginx
        location /images/ {
            alias /usr/share/nginx/html/images/;
            expires 30d; # Включаем кэширование на 30 дней для оптимизации скорости загрузки
            add_header Cache-Control "public, no-transform";
        }

        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ДОБАВИЛИ РОУТ ДЛЯ ИНТЕРАКТИВНОЙ ДОКУМЕНТАЦИИ FASTAPI БЭКЕНДА
        location /docs {
            proxy_pass http://backend:8000/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend:8000/openapi.json;
        }