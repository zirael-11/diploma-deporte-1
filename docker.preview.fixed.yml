services:
  # # 1. СЕРВИС ОБРАТНОГО ПРОКСИ-СЕРВЕРА NGINX (WEB-SERVER)
  web-server:
    image: nginx:latest
    container_name: deporte-preview-web-server
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # ПРОБРАСЫВАЕМ ПАПКУ С КАРТИНКАМИ ВНУТРЬ КОНТЕЙНЕРА NGINX:
      - ./src/assets/images:/usr/share/nginx/html/images:ro
    networks:
      - deporte_network
    depends_on:
      database:
        condition: service_healthy
      backend:
        condition: service_healthy

  # # 2. СЕРВИС БАЗЫ ДАННЫХ POSTGRESQL (DATABASE)
  database:
    image: postgres:14-alpine3.23
    container_name: deporte-preview-database
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      #Авто-запуск SQL-скрипта при старте базы
      - ./backend/01-deporte.sql:/docker-entrypoint-initdb.d/01-deporte.sql:ro
    environment:
      - POSTGRES_USER=nika
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=deporte_shop
    networks:
      - deporte_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nika", "-d", "deporte_shop"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # # 3. СЕРВИС FASTAPI БЭКЕНДА (BACKEND)
  backend:
    build:
      context: ./backend
      target: runtime
    container_name: deporte-preview-backend
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/migrations:/app/migrations
    environment:
      - DATABASE_URL=postgresql+asyncpg://nika:admin@database:5432/deporte_shop
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@deporte.ru
      - ADMIN_PASSWORD=admin
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    command: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - deporte_network
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # # 4. АВТОМАТИЧЕСКИЙ ПЕРЕНОС МИГРАЦИЙ Alembic ПРИ СТАРТЕ ПРОЕКТА
  migrate:
    build:
      context: ./backend
      target: builder # Использует наш оптимизированный builder-этап из Dockerfile
    container_name: deporte-preview-migrations
    environment:
      - DATABASE_URL=postgresql+asyncpg://nika:admin@database:5432/deporte_shop
      - POSTGRES_PORT=5432
      - POSTGRES_DB=deporte_shop
      - POSTGRES_USER=nika
      - POSTGRES_PASSWORD=admin
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/migrations:/app/migrations
    # Ждем, пока контейнер базы данных полностью поднимется и начнет принимать подключения
    depends_on:
      database:
        condition: service_healthy
    # Команда автоматически накатывает все миграции до самой последней версии
    command: poetry run alembic upgrade head
    networks:
      - deporte_network
 # # 5. ВЫСОКОПРОИЗВОДИТЕЛЬНЫЙ КЭШ REDIS ДЛЯ ХРАНЕНИЯ СЕССИЙ АВТОРИЗАЦИИ
  redis:
    image: redis:alpine3.23
    container_name: deporte-preview-redis
    networks:
      - deporte_network
    volumes:
      - redis_data:/data
    command: "redis-server --appendonly yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  deporte_network:
